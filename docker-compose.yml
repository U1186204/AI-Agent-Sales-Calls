# Oasis on Docker Compose (single service, SQLite on a named volume).
#
#   cp .env.example .env      # then edit secrets; see SECURITY.md
#   docker compose up --build
#   open http://localhost:3000
#
# Data persists in the `oasis-data` volume across restarts; `docker compose down -v` wipes it
# (the next boot reseeds because the database is empty).
services:
  oasis:
    build: .
    image: oasis:local
    init: true
    env_file: .env
    environment:
      # Container paths win over whatever .env says.
      DATABASE_URL: file:./.data/oasis.db
      OUTBOX_DIR: .data/outbox
      PORT: "3000"
      OASIS_SEED_ON_BOOT: if-empty
    ports:
      - "3000:3000"
    volumes:
      - oasis-data:/app/.data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

volumes:
  oasis-data:
